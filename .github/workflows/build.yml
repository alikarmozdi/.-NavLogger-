# Builds two things on every push (or with "Run workflow"):
#   NavLogger-apk   -> NavLogger.apk for the phone
#   ESP32-firmware  -> one .bin file, flashed once from a web browser at address 0x0
name: Build NavLogger APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Find the project
        shell: bash
        run: |
          set -e
          # Works when the files were uploaded normally, inside a sub-folder, or as the NavLogger.zip file itself.
          find_settings() { find . -path ./.git -prune -o -name settings.gradle -print 2>/dev/null | grep -v '/build/' | head -n 1 || true; }
          if [ -z "$(find_settings)" ]; then
            for z in $(find . -path ./.git -prune -o -name '*.zip' -print); do
              echo "Extracting $z"
              unzip -q -o "$z" -d _unzipped
            done
          fi
          SETTINGS="$(find_settings)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::Project files not found (settings.gradle). Upload ALL files of NavLogger.zip (folders app and esp32, files settings.gradle, build.gradle, gradle.properties) or the zip file itself."
            echo "Files in the repository:"
            find . -maxdepth 3 -path ./.git -prune -o -print
            exit 1
          fi
          PROJ="$(dirname "$SETTINGS")"
          echo "Project folder: $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          ls -la "$PROJ" "$PROJ/app"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

