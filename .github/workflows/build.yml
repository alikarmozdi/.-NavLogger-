        run: |
          cd "$PROJ"
          gradle --no-daemon --stacktrace :app:assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/NavLogger.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NavLogger-apk
          path: out/NavLogger.apk

  firmware:
    name: ESP32 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Find the firmware
        shell: bash
        run: |
          set -e
          find_ino() { find . -path ./.git -prune -o -name NavIMU_BLE.ino -print 2>/dev/null | head -n 1 || true; }
          if [ -z "$(find_ino)" ]; then
            for z in $(find . -path ./.git -prune -o -name '*.zip' -print); do
              echo "Extracting $z"
              unzip -q -o "$z" -d _unzipped
            done
          fi
          INO="$(find_ino)"
          if [ -z "$INO" ]; then
            echo "::error::esp32/NavIMU_BLE/NavIMU_BLE.ino not found. Upload the esp32 folder of NavLogger.zip."
            exit 1
          fi
          echo "SKETCH=$(dirname "$INO")" >> "$GITHUB_ENV"
          echo "Firmware: $INO"

      - name: Compiler tools
        uses: arduino/setup-arduino-cli@v2

      - name: Python (for the flash-file tool)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ESP32 board package
        shell: bash
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install esp32:esp32@3.0.7 --additional-urls "$ESP32_INDEX"

      - name: Compile firmware
        shell: bash
        run: |
          arduino-cli compile --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashMode=dio" --output-dir fw "$SKETCH"
          ls -la fw

      - name: Make one file to flash at address 0x0
        shell: bash
        run: |
          python -m pip install --quiet "esptool<5"
          BOOT_APP0="$(find ~/.arduino15/packages/esp32/hardware/esp32 -name boot_app0.bin | head -n 1)"
          python -m esptool --chip esp32 merge_bin -o NavIMU_firmware_flash_at_0x0.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x1000 fw/NavIMU_BLE.ino.bootloader.bin \
            0x8000 fw/NavIMU_BLE.ino.partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 fw/NavIMU_BLE.ino.bin
          ls -la NavIMU_firmware_flash_at_0x0.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-firmware
          path: NavIMU_firmware_flash_at_0x0.bin
