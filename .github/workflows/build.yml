name: Build NavLogger

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Find project folder
        id: proj
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle not found - Android project files are not in the repo"
            find . -maxdepth 4 -not -path './.git*'
            exit 1
          fi
          d=$(dirname "$f")
          echo "Project folder: $d"
          if [ ! -f "$d/app/navlogger.jks.b64" ]; then
            echo "::error::$d/app/navlogger.jks.b64 not found - upload it too"
            find "$d" -maxdepth 3 -not -path './.git*'
            exit 1
          fi
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signing key (fixed, so new APKs install over old ones)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: base64 -d app/navlogger.jks.b64 > app/navlogger.jks

      - name: Build APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp "${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/app-release.apk" out/NavLogger.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NavLogger-apk
          path: out/NavLogger.apk

  esp32:
    name: ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Find sketch folder
        id: sk
        run: |
          f=$(find . -name NavIMU_BLE.ino -not -path './.git/*' | head -n1)
          if [ -z "$f" ]; then
            echo "::error::NavIMU_BLE.ino not found - firmware file is not in the repo"
            find . -maxdepth 4 -not -path './.git*'
            exit 1
          fi
          d=$(dirname "$f")
          if [ "$(basename "$d")" != "NavIMU_BLE" ]; then
            echo "::error::NavIMU_BLE.ino must be inside a folder named NavIMU_BLE (found in $d)"
            exit 1
          fi
          echo "Sketch folder: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: ESP32 core 3.3.12
        env:
          URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
        run: |
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls "$URL"

      - name: Compile
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir out "${{ steps.sk.outputs.dir }}"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: NavIMU_BLE-firmware
          path: out/*.bin
